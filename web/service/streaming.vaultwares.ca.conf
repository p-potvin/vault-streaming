# streaming.vaultwares.ca — Vault Streaming web client.
#
# The app runs on clopeux-desktop (100.71.101.21:8722), which has the GPU for the
# NVENC transcode and CUDA Parakeet live subtitles. Greencloud is front door only.
#
# Tailnet-only: the :443 listener denies everything outside 100.64.0.0/10. The
# public :80 vhost exists solely so Let's Encrypt can complete HTTP-01 — it never
# proxies. nginx injects the app's auth token so viewers never handle it.
#
# __VW_TOKEN__ is substituted at install time; this file is the template kept in
# the repo, the installed copy on greencloud is mode 600 because it holds the token.

server {
    listen 80;
    listen [::]:80;
    server_name streaming.vaultwares.ca;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/monitor.vaultwares.ca;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    include /etc/nginx/snippets/cors.conf;
    server_name streaming.vaultwares.ca;

    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny all;

    ssl_certificate /etc/letsencrypt/live/docs.vaultwares.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.vaultwares.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Transcoded video is an unbounded stream and subtitle cues arrive on a
    # long-lived SSE connection: buffering here would stall both.
    proxy_buffering off;
    proxy_request_buffering off;

    # Server-sent events. The stream sits idle between cues, so a normal read
    # timeout would tear it down part-way through a film.
    location /api/events {
        proxy_pass http://100.71.101.21:8722;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-vw-token "__VW_TOKEN__";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://100.71.101.21:8722;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-vw-token "__VW_TOKEN__";
        proxy_connect_timeout 10s;
        proxy_send_timeout 12h;
        proxy_read_timeout 12h;
    }
}
