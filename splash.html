<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/splash.css">
</head>
<body>
  <div class="card">
    <img class="logo" src="public/vault-streaming-logo.png" alt="Vault Streaming">
    <div class="name">Vault<span>Streaming</span></div>
    <div class="bar"></div>
    <div class="status" id="status">Initializing…</div>
  </div>
  <script>
    const msgs = ['Initializing…', 'Connecting to Comet…', 'Loading your library…', 'Warming AI models…', 'Fetching from TMDB…'];
    let i = 0;
    const el = document.getElementById('status');
    setInterval(() => { i = (i + 1) % msgs.length; el.textContent = msgs[i]; }, 550);
  </script>
</body>
</html>
